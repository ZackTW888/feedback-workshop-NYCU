<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回饋練習場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@600;800&display=swap">
<style>
/* layout: one phone-width column, a station bar on top, one task per screen, a fixed action bar at the bottom */
:root{
  color-scheme: light;
  --purple:#603E8D; --purple-deep:#4A2E70; --yellow:#FFC94A; --teal:#36C2B4; --teal-ink:#0E6F66;
  --mist:#EFEAF7; --mist-2:#E2D9F0; --ink:#2E2640; --muted:#5E5676; --cloud:#FFFFFF; --note:#FFF4D6; --bad:#B4412F; --bad-bg:#FBEAE6;
  --font-display:'Nunito','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --r:20px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--mist);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%}
button,textarea{font:inherit;color:inherit}
#shell{max-width:520px;margin:0 auto;min-height:100%;background:var(--cloud);display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--cloud);padding:12px 16px 10px;border-bottom:1px solid var(--mist-2)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;color:var(--purple);font-size:16px}
.brand img{width:30px;height:30px}
.brand span.sub{margin-left:auto;font-family:var(--font-body);font-weight:500;color:var(--muted);font-size:13px}
.stations{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stations button{position:relative;border:2px solid transparent;border-radius:14px;background:var(--mist);color:var(--muted);font-size:12px;font-weight:700;padding:6px 2px 7px;min-height:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.stations button b{width:22px;height:22px;border-radius:11px;background:var(--cloud);color:var(--purple);font-family:var(--font-display);font-size:13px;display:flex;align-items:center;justify-content:center}
.stations button.done{color:var(--purple)}
.stations button.done b{background:var(--teal);color:#fff}
.stations button.now{background:var(--purple);color:#fff}
.stations button.now b{background:var(--yellow);color:var(--ink)}
.stations button.up{border-color:var(--yellow);border-style:dashed;color:var(--ink);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{background:var(--note)}}
@media (prefers-reduced-motion:reduce){.stations button.up{animation:none}}
.stations button:not(:nth-child(4n))::after{content:"";position:absolute;right:-8px;top:50%;width:6px;height:2px;background:var(--mist-2)}
.stations button:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
.art{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:var(--r);background:var(--mist);display:block}
.remind{background:var(--note);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.remind p{display:flex;gap:10px}.remind p b{flex:none;color:#8A6200}
.empty{border:2px dashed var(--mist-2);border-radius:16px;padding:12px 14px;color:var(--muted);font-size:15px}
.empty button{border:0;background:none;color:var(--purple);font-weight:700;text-decoration:underline;padding:0;cursor:pointer;font-size:15px}
#cardImg{width:100%;height:auto;border-radius:var(--r);display:block;box-shadow:0 4px 18px rgba(46,38,64,.18)}
main{flex:1;padding:20px 16px 120px;display:flex;flex-direction:column;gap:18px}
h1{font-size:30px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:23px;line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-weight:700;color:var(--purple);font-size:14px;letter-spacing:.08em}
.lead{color:var(--muted)}
.guide{display:flex;gap:12px;align-items:flex-start}
.guide svg{flex:none;width:54px;height:54px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.guide svg{animation:none}}
.guide .say{background:var(--mist);border-radius:4px 18px 18px 18px;padding:10px 14px;font-size:16px}
.card{background:var(--mist);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.sticky{background:var(--note);border-radius:6px 6px 22px 6px;padding:16px;font-weight:700;font-size:19px;box-shadow:0 3px 0 #EBD9A6;transform:rotate(-1deg)}
.sticky small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--cloud);border:2px solid var(--mist-2);border-radius:16px;padding:14px 16px;min-height:56px;cursor:pointer;font-size:17px;line-height:1.5}
.opt small{display:block;color:var(--muted);font-size:13px}
.opt:focus-visible,.btn:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.opt.sel{border-color:var(--purple);background:var(--mist);font-weight:700}
.opt.ok{border-color:var(--teal);background:#E4F7F4;font-weight:700}
.opt.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt[disabled]{cursor:default}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri .opt{text-align:center;padding:16px 6px;font-weight:700;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--mist-2);background:var(--cloud);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer;font-size:16px}
.chip.sel{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:700}
.fb{border-radius:16px;padding:12px 14px;font-size:16px}
.fb.ok{background:#E4F7F4;color:var(--teal-ink)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb.tip{background:var(--note);color:var(--ink)}
.fb b{display:block}
textarea{width:100%;border:2px solid var(--mist-2);border-radius:16px;padding:12px 14px;min-height:92px;resize:vertical;background:var(--cloud)}
.tag{display:inline-block;border:2px solid var(--purple);color:var(--purple);border-radius:12px;padding:1px 10px;font-weight:700;font-size:15px}
.tag.t{border-color:var(--teal);color:var(--teal-ink)} .tag.y{border-color:#C98F00;color:#8A6200}
.meter{display:flex;justify-content:space-between;font-family:var(--font-display);font-weight:800;color:var(--purple);font-variant-numeric:tabular-nums}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:16px}
.msg.them{background:var(--mist);border-top-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--purple);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.msg small{display:block;font-size:12px;opacity:.8}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:baseline;border-left:5px solid var(--mist-2);padding-left:12px}
.row b{flex:none;color:var(--purple);min-width:4.2em}
.summary{border:3px solid var(--purple);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.summary h3{margin:0;font-size:14px;color:var(--purple);letter-spacing:.08em}
.summary .v{font-weight:700}
.summary ul{margin:0;padding-left:1.2em}
footer.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none}
footer.bar .in{max-width:520px;margin:0 auto;padding:12px 16px 16px;background:linear-gradient(to top,var(--cloud) 72%,rgba(255,255,255,0));display:flex;gap:10px;pointer-events:auto}
.btn{flex:1;border:0;border-radius:999px;min-height:54px;font-weight:700;font-size:18px;cursor:pointer;background:var(--purple);color:#fff}
.btn[disabled]{background:var(--mist-2);color:#8F86A8;cursor:not-allowed}
.btn.ghost{flex:none;width:54px;background:var(--mist);color:var(--purple)}
.copy{font-size:12px;color:var(--muted);text-align:center}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.steps3 div{background:var(--mist);border-radius:14px;padding:10px 4px;font-weight:700;color:var(--purple)}
.steps3 div.on{background:var(--purple);color:#fff}
</style>
</head>

function quiz(key,items,labels,act){
 const st=S[key],i=st.i;
 if(i>=items.length)return null;
 const it=items[i],a=st.ans[i],done=a!==undefined,right=done&&a===it.a,near=done&&it.p===a;
 return `<div class="meter"><span>第 ${i+1} / ${items.length} 句</span><span id="clock"></span></div>
 <div class="card"><p class="lead" style="font-size:14px">${it.from}</p><p style="font-size:20px;font-weight:700">${it.q}</p></div>
 <div class="tri">${labels.map((l,j)=>opt(act,j,l.replace('觸發',''),done?(j===it.a?'ok':(j===a?'no':'')):'',done)).join('')}</div>
 ${done?`<div class="fb ${right?'ok':near?'tip':'no'}"><b>${right?'答對了':near?'很接近':'再想一下'}</b>${it.why}</div><button class="opt sel" data-act="${act}-next" style="text-align:center">${i+1<items.length?'下一句':'看結果'}</button>`:''}`;
}

 <p class="lead">不用一次到位。先試一小步，驗證這個建議適不適合你。</p>
 <div class="opts">${EXPS.map((s,i)=>opt('exp',i,s,S.exp===s?'sel':'')).join('')}</div>
 <p><b>針對你的便利貼，這週想去問誰？（1 到 3 位）</b></p>
 <div class="chips">${ASKERS.map((p,i)=>`<button class="chip ${S.who.includes(i)?'sel':''}" data-act="who" data-i="${i}">${p}</button>`).join('')}</div>`};
};
const myStds=()=>S.std.map(i=>STDS[i]).concat(S.stdOwn.trim()?[S.stdOwn.trim()]:[]).slice(0,3);
V[7]=()=>({label:'重新練習一次',html:`<p class="eyebrow">完成</p><h2>帶走你的行動圖卡</h2>
 ${guide('按下方按鈕下載 PNG，或長按圖片儲存。這週做到那個小實驗，記得慶祝一下！')}
 <img id="cardImg" alt="從回饋中成長圖卡：收到的指教、回饋類型、觸發、自我對話、評量標準與小型實驗" width="1080" height="1350">
 <button class="opt sel" data-act="dl" style="text-align:center">下載 PNG 圖卡</button>
 <div id="dlMsg"></div>
 <div class="fb tip"><b>主動要回饋，只要一句話</b>「你覺得我有哪一件事，正在擋住自己？」</div>
 <p class="copy">著作權Ⓒ 2026 AI效能實驗室 許秉軒 版權所有</p>`});

// ---------- image card ----------
const loadImg=src=>new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src});
let cardBlob=null,cardSeq=0;
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrap(c,t,w){const out=[];let cur='';for(const ch of t){if(ch==='\n'){out.push(cur);cur='';continue}if(c.measureText(cur+ch).width>w&&cur){out.push(cur);cur=ch}else cur+=ch}if(cur)out.push(cur);return out}
function paint(c,W,ill,logo,draw){
 const F=(s,b)=>{c.font=`${b?700:400} ${s}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`};
 const P='#603E8D',INK='#2E2640',MU='#5E5676',YE='#FFC94A',MI='#EFEAF7';
 const text=(t,x,y,col)=>{if(draw){c.fillStyle=col;c.fillText(t,x,y)}};
 const box=(x,y,w,h,r,col)=>{if(draw){rr(c,x,y,w,h,r);c.fillStyle=col;c.fill()}};
 c.textBaseline='top';
 if(draw){c.fillStyle=MI;c.fillRect(0,0,W,c.canvas.height);box(40,40,W-80,c.canvas.height-80,48,'#fff')}
 // header
 if(draw){c.save();rr(c,40,40,W-80,300,48);c.clip();c.fillStyle=P;c.fillRect(40,40,W-80,300);c.restore()}
 if(draw&&logo){c.beginPath();c.arc(140,150,56,0,7);c.fillStyle='#fff';c.fill();c.drawImage(logo,92,102,96,96)}
 F(68,1);text('從回饋中成長',218,96,'#fff');F(34,1);text('成功接收指教的三大關鍵',220,188,YE);
 F(26,0);text('接收 ・ 接受 ・ 接手',220,244,'#E4DCF2');
 if(draw&&ill){c.save();rr(c,700,90,300,200,28);c.clip();c.drawImage(ill,700,90,300,200);c.restore();rr(c,700,90,300,200,28);c.strokeStyle='#fff';c.lineWidth=6;c.stroke()}
 let y=380;const X=100,TW=W-200;
 // sticky note
 F(44,1);const nl=wrap(c,'「'+(S.note.trim()||'（還沒選便利貼）')+'」',TW-80);
 const nh=70+nl.length*62+30;box(X,y,TW,nh,24,'#FFF4D6');
 F(26,1);text('收到的指教',X+40,y+28,'#8A6200');F(44,1);nl.forEach((l,i)=>text(l,X+40,y+70+i*62,INK));y+=nh+44;
 const sec=(label,lines,bold)=>{F(26,1);text(label,X,y,P);y+=42;F(38,bold);lines.forEach(t=>wrap(c,t,TW).forEach(l=>{text(l,X,y,INK);y+=54}));y+=30};
 sec('接收',['類型：'+(S.own||'未選')+'　　觸發：'+((S.trig&&S.trig.length)?S.trig.map(t=>t.replace('觸發','')).join('、'):'不明顯')],true);
 if(draw){c.fillStyle=MI;c.fillRect(X,y-14,TW,4)}y+=14;
 F(26,1);text('接受｜我的自我對話',X,y,P);y+=42;
 F(34,0);wrap(c,'「'+(S.voice.trim()||'……')+'」',TW).forEach(l=>{text(l,X,y,MU);y+=48});
 F(40,1);wrap(c,'→「'+(S.rewrite.trim()||'這件事還能更好')+'」',TW).forEach(l=>{text(l,X,y,P);y+=58});y+=30;
 if(draw){c.fillStyle=MI;c.fillRect(X,y-14,TW,4)}y+=14;
 F(26,1);text('接手｜我的評量標準',X,y,P);y+=46;
 const st=myStds();(st.length?st:['（還沒選標準）']).forEach(t=>{F(36,1);const ls=wrap(c,t,TW-70);if(draw){c.beginPath();c.arc(X+22,y+24,22,0,7);c.fillStyle='#36C2B4';c.fill();c.strokeStyle='#fff';c.lineWidth=6;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(X+11,y+25);c.lineTo(X+19,y+33);c.lineTo(X+33,y+16);c.stroke()}ls.forEach(l=>{text(l,X+66,y,INK);y+=50});y+=14});y+=20;
 // experiment pill
 F(36,1);const el=wrap(c,S.exp||'（還沒選小型實驗）',TW-80);const wl=S.who.length?'我要去問：'+S.who.map(i=>ASKERS[i]).join('、'):'';
 const eh=66+el.length*50+(wl?50:0)+26;box(X,y,TW,eh,28,MI);
 F(26,1);text('這週的小型實驗',X+40,y+24,P);F(36,1);el.forEach((l,i)=>text(l,X+40,y+64+i*50,INK));
 if(wl){F(30,0);text(wl,X+40,y+64+el.length*50+4,MU)}y+=eh+40;
 F(34,1);const cw=c.measureText('做到了，就慶祝這個小成功').width;box((W-cw)/2-44,y,cw+88,76,38,YE);text('做到了，就慶祝這個小成功',(W-cw)/2,y+18,INK);y+=76+34;
 F(22,0);const cp='著作權Ⓒ 2026 AI效能實驗室 許秉軒 版權所有';text(cp,(W-c.measureText(cp).width)/2,y,MU);y+=22+70;
 return y;
}
async function makeCard(){
 const seq=++cardSeq,W=1080;
 try{await Promise.all([document.fonts.load('700 40px "Noto Sans TC"','從回饋中成長成功接收指教的三大關鍵'+S.note+S.voice+S.rewrite+S.stdOwn),document.fonts.load('400 30px "Noto Sans TC"','接收接受接手')])}catch(e){}
 const [ill,logo]=await Promise.all([loadImg('img/s8.jpg'),loadImg($('logoImg').src)]);
 const cv=document.createElement('canvas');cv.width=W;cv.height=10;
 const h=Math.max(1350,paint(cv.getContext('2d'),W,null,null,false));
 cv.height=h;paint(cv.getContext('2d'),W,ill,logo,true);
 if(seq!==cardSeq)return;
 const el=$('cardImg');if(!el)return;
 el.height=h;
 try{el.src=cv.toDataURL('image/png')}catch(e){}
 cv.toBlob(b=>{if(seq===cardSeq)cardBlob=b},'image/png');
}
async function download(){
 const m=$('dlMsg');
 const manual=()=>{m.innerHTML='<div class="fb tip"><b>這個畫面無法直接下載</b>請長按上方圖卡，選「儲存影像」；電腦請按右鍵另存。</div>'};
 if(!cardBlob){manual();return}
 let dl=null;
 try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}
 if(!dl){try{const a=document.createElement('a');a.href=URL.createObjectURL(cardBlob);a.download='從回饋中成長_我的圖卡.png';document.body.appendChild(a);a.click();a.remove();m.innerHTML='<div class="fb ok">已開始下載。如果沒有反應，請長按上方圖卡儲存。</div>'}catch(e){manual()}return}
 try{await dl.save({filename:'從回饋中成長_我的圖卡.png',data:cardBlob});m.innerHTML='<div class="fb ok">圖卡已儲存。</div>'}
 catch(e){if(e&&e.code==='declined')m.innerHTML='';else manual()}
}

let view;
function render(scroll){
 view=V[S.step]();
 $('app').innerHTML=view.html;
 $('next').textContent=view.label||'下一步';
 $('back').style.visibility=S.step===0?'hidden':'visible';
 $('where').textContent=(S.step+1)+' / '+NAMES.length;
 $('stations').innerHTML=NAMES.map((n,i)=>`<button data-go="${i}" class="${i<S.step?'done':i===S.step?'now':i===S.step+1?'up':''}" ${i===S.step?'aria-current="step"':''}><b>${i<S.step?'✓':i+1}</b><span>${n}</span></button>`).join('');
 if(scroll)window.scrollTo(0,0);
 save();tick();
 if(S.step===7){cardBlob=null;makeCard()}
}
function tick(){const c=$('clock');if(c&&S.step===2&&S.cls.t0&&!S.cls.t1)c.textContent=Math.round((Date.now()-S.cls.t0)/1000)+' 秒'}
setInterval(tick,500);
const toggle=(arr,i)=>{const k=arr.indexOf(i);k>=0?arr.splice(k,1):arr.push(i)};

document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');
 if(g){S.step=+g.dataset.go;render(true);return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,i=+b.dataset.i;
 if(a==='note'){S.pick=i;S.note=i===9?'':NOTES[i].t}
 else if(a==='cls'){if(!S.cls.t0)S.cls.t0=Date.now();S.cls.ans[S.cls.i]=i}
 else if(a==='cls-next'){S.cls.i++;if(S.cls.i>=CLS.length)S.cls.t1=Date.now()}
 else if(a==='cls-reset'){S.cls={i:0,ans:[],t0:0,t1:0}}
 else if(a==='own'){S.own=TYPES[i]}
 else if(a==='tq'){S.tq.ans[S.tq.i]=i}
 else if(a==='tq-next'){S.tq.i++}
 else if(a==='selfq'){S.t[i]=+b.dataset.j}
 else if(a==='rpk'){S.rpk=i}
 else if(a==='rp'){const r=S.rps[S.rpk],o=RP[S.rpk].r[r.i].opts[i];if(o.ok){r.log.push(i);r.i++;r.wrong=-1}else r.wrong=i}
 else if(a==='rp-reset'){S.rps[S.rpk]={i:0,log:[],wrong:-1}}
 else if(a==='voice'){S.vpick=i;S.voice=i===9?'':VOICES[i];if(!S.rewrite)S.rewrite='這件事還能'}
 else if(a==='rewr'){S.rewrite=REWR[i]}
 else if(a==='ask'){toggle(S.ask,i)}
 else if(a==='common'){toggle(S.common,i)}
 else if(a==='std'){toggle(S.std,i)}
 else if(a==='exp'){S.exp=EXPS[i]}
 else if(a==='who'){toggle(S.who,i)}
 else if(a==='dl'){download();return}
 render(false);
});
document.addEventListener('input',e=>{const k=e.target.dataset.bind;if(!k)return;S[k]=e.target.value;save()});
$('next').addEventListener('click',()=>{
 if(S.step===7){S=fresh();render(true);return}
 S.step++;render(true);
});
$('back').addEventListener('click',()=>{if(S.step>0){S.step--;render(true)}});
render(false);
</script>
